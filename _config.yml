# Site settings
title: Tung Lin
header: Tung Lin
email: tunglin@yahoo.com
url: https://tunglinn.github.io
description: "Portfolio of Tung Lin — data analyst and transportation enthusiast specializing in transit planning, data visualization, and web development."
keywords: "transportation data, transit planning, web development, data visualization, GIS, parking reform"
skills: "data_analyst --mode=transportation --stack=web"
meta_author: Tung Lin

# SEO (jekyll-seo-tag)
author:
  name: Tung Lin
  email: tunglin@yahoo.com
logo: /img/profile.png
social:
  name: Tung Lin
  links:
    - https://www.linkedin.com/in/tung-lin/
    - https://github.com/tunglinn
twitter:
  card: summary_large_image

# Google webmaster tools
google_verify:

# https://ssl.bing.com/webmaster/configure/verify/ownership Option 2 content= goes here
bing_verify:

# Contact form:
# - static : pass through formspree.io to validate email sending
# - disqus : replace contact form by disqus thread
contact: static

# If you use disqus you need disqus shortname
disqus_shortname: tunglin

# Color settings (hex-codes without the leading hash-tag)
color:
  primary: 00ff88
  primary-rgb: "0,255,136"
  secondary: ff0090
  secondary-dark: 0a0a0f

# Footer settings
footer:
  copyright: Tung Lin
  location: Location
  social: Connect
  credits: Built With

# Social networks
social_links:
  - title: linkedin
    url: https://www.linkedin.com/in/tung-lin/
  - title: github
    url: https://github.com/tunglinn

# Postal address
address:
  - line: Taipei, Taiwan
  - line: Cupertino, California
  - line: Los Angeles, California

# Credits content
credits: 'Jekyll + GitHub Pages'

# Build settings
markdown: kramdown
permalink: pretty

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      permalink: "/post/:title/"
